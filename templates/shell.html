<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DNAmedicatiepas{% endblock %}</title>
    <meta name="description" content="{% block description %}{% endblock %}">
    {% block meta %}
        <link rel="canonical" href="{{ site_url }}{{ request.path }}">

        <meta property="og:type" content="website">
        <meta property="og:site_name" content="DNAmedicatiepas">
        <meta property="og:locale" content="nl_NL">
        <meta property="og:title" content="{{ self.title() }}">
        <meta property="og:description" content="{{ self.description() }}">
        <meta property="og:url" content="{{ site_url }}{{ request.path }}">
    {% endblock %}

    <meta name="theme-color" content="#FBF9FA">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block page_css %}{% endblock %}
    <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/switzer" rel="stylesheet">
    {% block icon_font %}
        <link href="https://cdn.jsdelivr.net/npm/fontawesome6pro@1.0.2/css/all.min.css" rel="stylesheet">
    {% endblock %}
</head>
<body>
<div class="page">
    {% include "partials/site_header.html" %}

    <main class="shell">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/site_footer.html" %}
</div>
</body>
</html>
